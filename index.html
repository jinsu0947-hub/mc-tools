<!DOCTYPE html>
<html>
<head>
  <title>McRAD Viewer</title>
</head>

<body>
  <h2>McRAD - Node & Road Editor</h2>

  <button onclick="downloadJSON()">Save (roads.json)</button>
  <br><br>

  <input type="file" id="fileInput" accept=".json">
  <button onclick="loadJSON()">Load</button>
  <br><br>

  <canvas id="canvas" width="800" height="600" style="border:1px solid black;"></canvas>

  <script>
    // =========================
    // 데이터
    // =========================
    let nodes = [];
    let segments = [];
    let selectedNodes = [];
    let selectedSegment = null;
    let draggingNode = null;

    // =========================
    // 캔버스 설정
    // =========================
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // =========================
    // 클릭 이벤트
    // =========================
    canvas.addEventListener("click", function(e) {

      if (draggingNode) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 🔴 선 먼저 검사
      selectedSegment = null;

      for (let s of segments) {
        if (isPointNearLine(x, y, s.start.x, s.start.y, s.end.x, s.end.y)) {
          selectedSegment = s;
          selectedNodes = [];
          draw();
          return;
        }
      }

      // 기존 노드 클릭 감지
      let clickedNode = null;
      const radius = 10;

      for (let n of nodes) {
        const dx = n.x - x;
        const dy = n.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius) {
          clickedNode = n;
          break;
        }
      }

      if (clickedNode) {
        // 기존 노드 선택
        selectedNodes.push(clickedNode);

        // 2개 선택되면 선 생성
        if (selectedNodes.length === 2) {
          const seg = {
            id: segments.length + 1,
            start: selectedNodes[0],
            end: selectedNodes[1]
          };
          segments.push(seg);

          selectedNodes = [];
        }

      } else {
        // 새 노드 생성
        const node = {
          id: nodes.length + 1,
          x: x,
          y: y
        };
        nodes.push(node);
      }

      draw();
   });

    canvas.addEventListener("mousedown", function(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const radius = 10;

      for (let n of nodes) {
        const dx = n.x - x;
        const dy = n.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius) {
          draggingNode = n;
          break;
        }
      }
    });

    canvas.addEventListener("mousemove", function(e) {
      if (!draggingNode) return;

      const rect = canvas.getBoundingClientRect();
      draggingNode.x = e.clientX - rect.left;
      draggingNode.y = e.clientY - rect.top;

      draw();
    });

    canvas.addEventListener("mouseup", function() {
      draggingNode = null;
    });

    // =========================
    // 그리기 함수
    // =========================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 선 그리기
      segments.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.start.x, s.start.y);
        ctx.lineTo(s.end.x, s.end.y);
        ctx.stroke();
      });

      // 선택된 선 강조
      if (selectedSegment) {
        ctx.beginPath();
        ctx.moveTo(selectedSegment.start.x, selectedSegment.start.y);
        ctx.lineTo(selectedSegment.end.x, selectedSegment.end.y);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "black";
      }

      // 노드 그리기
      nodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 선택된 노드 표시
      selectedNodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = "red";
        ctx.stroke();
        ctx.strokeStyle = "black"; // 다시 원래 색으로
      });
    }

      function downloadJSON() {
    // 저장할 데이터 구조
    const data = {
      nodes: nodes.map(n => ({
        id: n.id,
        x: n.x,
        y: n.y
      })),
      segments: segments.map(s => ({
        id: s.id,
        start_node: s.start.id,
        end_node: s.end.id
      }))
    };

    const json = JSON.stringify(data, null, 2);

    // 파일 생성
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "roads.json";
    a.click();

    URL.revokeObjectURL(url);
  }

  function loadJSON() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
      alert("파일 선택");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const data = JSON.parse(e.target.result);

      // 초기화
      nodes = [];
      segments = [];
      selectedNodes = [];
      selectedSegment = null;

      // ✅ 1️⃣ Node 먼저 생성 (ID 유지)
      data.nodes.forEach(n => {
        nodes.push({
          id: n.id,
          x: n.x,
          y: n.y
        });
      });

      // ✅ 2️⃣ Segment 연결 (핵심)
      data.segments.forEach(s => {

        const startNode = nodes.find(n => n.id === s.start_node);
        const endNode = nodes.find(n => n.id === s.end_node);

        if (!startNode || !endNode) {
          console.log("노드 연결 실패", s);
          return;
        }

        segments.push({
          id: s.id,
          start: startNode,
          end: endNode
        });
      });

      console.log(nodes);
      console.log(segments);

      draw();
    };

    reader.readAsText(file);
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Delete") {

      // 🔴 선 삭제
      if (selectedSegment) {
        segments = segments.filter(s => s !== selectedSegment);
        selectedSegment = null;
        draw();
        return;
      }

      // 🔵 Node 삭제
      if (selectedNodes.length > 0) {
        const nodeToDelete = selectedNodes[0];

        segments = segments.filter(s =>
          s.start !== nodeToDelete && s.end !== nodeToDelete
        );

        nodes = nodes.filter(n => n !== nodeToDelete);

        selectedNodes = [];
        draw();
      }

      function isPointNearLine(px, py, x1, y1, x2, y2) {
        const A = px - x1;
        const B = py - y1;
        const C = x2 - x1;
        const D = y2 - y1;

        const dot = A * C + B * D;
        const len_sq = C * C + D * D;
        let param = -1;

        if (len_sq !== 0) {
          param = dot / len_sq;
        }

        let xx, yy;

        if (param < 0) {
          xx = x1;
          yy = y1;
        } else if (param > 1) {
          xx = x2;
          yy = y2;
        } else {
          xx = x1 + param * C;
          yy = y1 + param * D;
        }

        const dx = px - xx;
        const dy = py - yy;

        return Math.sqrt(dx * dx + dy * dy) < 10; // ← 10으로 유지
      }
      
    }
  });

  </script>
</body>
</html>
