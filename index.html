<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline Road Engine</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        color: white;
        font-family: sans-serif;
    }

    canvas {
        display: block;
        background: #1b1b1b;
    }

    .ui {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border-radius: 8px;
        z-index: 10;
    }
</style>
</head>
<body>

<div class="ui">
    Left Click: Create Node<br>
    Shift + Click Node: Connect
</div>

<canvas id="canvas"></canvas>

<script>

// =====================================================
// CONFIG
// =====================================================

const CONFIG = {
    laneWidth: 12,
    roadWidth: 24,
    intersectionBuffer: 30,
};

// =====================================================
// ID GENERATOR
// =====================================================

class IdGenerator {
    static next(prefix) {
        IdGenerator.count ??= 0;
        return `${prefix}_${IdGenerator.count++}`;
    }
}

// =====================================================
// STRUCTURE STATE
// =====================================================

class StructureState {
    constructor() {
        this.nodes = [];
        this.segments = [];
    }
}

// =====================================================
// DERIVED STATE
// =====================================================

class DerivedState {
    constructor() {
        this.intersections = [];
        this.laneNodes = [];
        this.laneConnections = [];
    }
}

// =====================================================
// GEOMETRY STATE
// =====================================================

class GeometryState {
    constructor() {
        this.centerlines = [];
        this.turnCurves = [];
        this.roadPolygons = [];
    }
}

// =====================================================
// ENGINE STATE
// =====================================================

class EngineState {
    constructor() {
        this.structure = new StructureState();
        this.derived = new DerivedState();
        this.geometry = new GeometryState();
    }

    clearDerived() {
        this.derived = new DerivedState();
        this.geometry = new GeometryState();
    }
}

const engine = new EngineState();

// =====================================================
// NODE
// =====================================================

class Node {
    constructor(x, y) {
        this.id = IdGenerator.next("node");
        this.x = x;
        this.y = y;
    }
}

// =====================================================
// ROAD SEGMENT
// =====================================================

class RoadSegment {
    constructor(startNode, endNode) {
        this.id = IdGenerator.next("segment");

        this.startNode = startNode.id;
        this.endNode = endNode.id;

        this.laneCount = 2;
        this.laneWidth = CONFIG.laneWidth;
        this.roadWidth = CONFIG.roadWidth;
    }
}

// =====================================================
// GRAPH UTILITIES
// =====================================================

class GraphUtils {

    static getNodeById(id) {
        return engine.structure.nodes.find(n => n.id === id);
    }

    static getConnectedSegments(nodeId) {
        return engine.structure.segments.filter(seg =>
            seg.startNode === nodeId || seg.endNode === nodeId
        );
    }

    static hasDuplicateSegment(a, b) {
        return engine.structure.segments.some(seg => {
            return (
                (seg.startNode === a.id && seg.endNode === b.id) ||
                (seg.startNode === b.id && seg.endNode === a.id)
            );
        });
    }
}

// =====================================================
// STEP 01
// VALIDATE GRAPH
// =====================================================

class Step01_ValidateGraph {

    static run() {

        const unique = [];

        for (const seg of engine.structure.segments) {

            const duplicate = unique.some(s =>
                (s.startNode === seg.startNode && s.endNode === seg.endNode) ||
                (s.startNode === seg.endNode && s.endNode === seg.startNode)
            );

            if (!duplicate) {
                unique.push(seg);
            }
        }

        engine.structure.segments = unique;
    }
}

// =====================================================
// STEP 02
// GENERATE INTERSECTIONS
// =====================================================

class Step02_GenerateIntersections {

    static run() {

        for (const node of engine.structure.nodes) {

            const connected = GraphUtils.getConnectedSegments(node.id);

            if (connected.length >= 3) {

                engine.derived.intersections.push({
                    id: IdGenerator.next("intersection"),
                    centerNodeId: node.id,
                    connectedSegments: connected.map(s => s.id)
                });
            }
        }
    }
}

// =====================================================
// STEP 03
// GENERATE CENTERLINES
// =====================================================

class Step03_GenerateCenterlines {

    static run() {

        for (const seg of engine.structure.segments) {

            const start = GraphUtils.getNodeById(seg.startNode);
            const end = GraphUtils.getNodeById(seg.endNode);

            engine.geometry.centerlines.push({
                segmentId: seg.id,
                polyline: [
                    { x: start.x, y: start.y },
                    { x: end.x, y: end.y }
                ]
            });
        }
    }
}

// =====================================================
// STEP 04
// GENERATE INTERSECTION BOUNDARIES
// =====================================================

class Step04_GenerateIntersectionBoundaries {

    static run() {

        for (const intersection of engine.derived.intersections) {

            const centerNode = GraphUtils.getNodeById(intersection.centerNodeId);

            intersection.boundary = {
                x: centerNode.x,
                y: centerNode.y,
                radius: CONFIG.intersectionBuffer
            };
        }
    }
}

// =====================================================
// STEP 05
// GENERATE LANE NODES
// =====================================================

class Step05_GenerateLaneNodes {

    static run() {

        for (const intersection of engine.derived.intersections) {

            const centerNode = GraphUtils.getNodeById(intersection.centerNodeId);

            for (const segId of intersection.connectedSegments) {

                const seg = engine.structure.segments.find(s => s.id === segId);

                const otherNodeId =
                    seg.startNode === centerNode.id
                        ? seg.endNode
                        : seg.startNode;

                const otherNode = GraphUtils.getNodeById(otherNodeId);

                const dx = otherNode.x - centerNode.x;
                const dy = otherNode.y - centerNode.y;

                const len = Math.hypot(dx, dy);

                const nx = dx / len;
                const ny = dy / len;

                const px = centerNode.x + nx * CONFIG.intersectionBuffer;
                const py = centerNode.y + ny * CONFIG.intersectionBuffer;

                engine.derived.laneNodes.push({
                    id: IdGenerator.next("laneNode"),
                    intersectionId: intersection.id,
                    segmentId: seg.id,
                    x: px,
                    y: py,
                    directionX: nx,
                    directionY: ny
                });
            }
        }
    }
}

// =====================================================
// STEP 06
// GENERATE LANE CONNECTIONS
// =====================================================

class Step06_GenerateLaneConnections {

    static run() {

        const groups = {};

        for (const laneNode of engine.derived.laneNodes) {

            if (!groups[laneNode.intersectionId]) {
                groups[laneNode.intersectionId] = [];
            }

            groups[laneNode.intersectionId].push(laneNode);
        }

        for (const intersectionId in groups) {

            const nodes = groups[intersectionId];

            for (const from of nodes) {
                for (const to of nodes) {

                    if (from.id === to.id) continue;
                    if (from.segmentId === to.segmentId) continue;

                    engine.derived.laneConnections.push({
                        id: IdGenerator.next("connection"),
                        fromLaneNode: from.id,
                        toLaneNode: to.id
                    });
                }
            }
        }
    }
}

// =====================================================
// STEP 07
// GENERATE TURN CURVES
// =====================================================

class Step07_GenerateTurnCurves {

    static run() {

        for (const connection of engine.derived.laneConnections) {

            const from = engine.derived.laneNodes.find(n =>
                n.id === connection.fromLaneNode
            );

            const to = engine.derived.laneNodes.find(n =>
                n.id === connection.toLaneNode
            );

            const mx = (from.x + to.x) * 0.5;
            const my = (from.y + to.y) * 0.5;

            engine.geometry.turnCurves.push({
                connectionId: connection.id,
                points: [
                    { x: from.x, y: from.y },
                    { x: mx, y: my },
                    { x: to.x, y: to.y }
                ]
            });
        }
    }
}

// =====================================================
// STEP 08
// GENERATE ROAD POLYGONS
// =====================================================

class Step08_GenerateRoadPolygons {

    static run() {

        for (const centerline of engine.geometry.centerlines) {

            const p0 = centerline.polyline[0];
            const p1 = centerline.polyline[1];

            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;

            const len = Math.hypot(dx, dy);

            const nx = -dy / len;
            const ny = dx / len;

            const half = CONFIG.roadWidth * 0.5;

            const poly = [
                {
                    x: p0.x + nx * half,
                    y: p0.y + ny * half
                },
                {
                    x: p1.x + nx * half,
                    y: p1.y + ny * half
                },
                {
                    x: p1.x - nx * half,
                    y: p1.y - ny * half
                },
                {
                    x: p0.x - nx * half,
                    y: p0.y - ny * half
                }
            ];

            engine.geometry.roadPolygons.push({
                segmentId: centerline.segmentId,
                polygon: poly
            });
        }
    }
}

// =====================================================
// PIPELINE RUNNER
// =====================================================

class PipelineRunner {

    static rebuild() {

        engine.clearDerived();

        Step01_ValidateGraph.run();
        Step02_GenerateIntersections.run();
        Step03_GenerateCenterlines.run();
        Step04_GenerateIntersectionBoundaries.run();
        Step05_GenerateLaneNodes.run();
        Step06_GenerateLaneConnections.run();
        Step07_GenerateTurnCurves.run();
        Step08_GenerateRoadPolygons.run();
    }
}

// =====================================================
// RENDERER
// =====================================================

class Renderer {

    static draw(ctx) {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        Renderer.drawRoadPolygons(ctx);
        Renderer.drawCenterlines(ctx);
        Renderer.drawTurnCurves(ctx);
        Renderer.drawNodes(ctx);
        Renderer.drawIntersections(ctx);
    }

    static drawRoadPolygons(ctx) {

        ctx.fillStyle = "#333";

        for (const road of engine.geometry.roadPolygons) {

            const poly = road.polygon;

            ctx.beginPath();
            ctx.moveTo(poly[0].x, poly[0].y);

            for (let i = 1; i < poly.length; i++) {
                ctx.lineTo(poly[i].x, poly[i].y);
            }

            ctx.closePath();
            ctx.fill();
        }
    }

    static drawCenterlines(ctx) {

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;

        for (const line of engine.geometry.centerlines) {

            const p0 = line.polyline[0];
            const p1 = line.polyline[1];

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
        }
    }

    static drawNodes(ctx) {

        ctx.fillStyle = "orange";

        for (const node of engine.structure.nodes) {

            ctx.beginPath();
            ctx.arc(node.x, node.y, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    static drawIntersections(ctx) {

        ctx.strokeStyle = "cyan";

        for (const inter of engine.derived.intersections) {

            const b = inter.boundary;

            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    static drawTurnCurves(ctx) {

        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 1;

        for (const curve of engine.geometry.turnCurves) {

            const p0 = curve.points[0];
            const p1 = curve.points[1];
            const p2 = curve.points[2];

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
            ctx.stroke();
        }
    }
}

// =====================================================
// CANVAS
// =====================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

// =====================================================
// INPUT
// =====================================================

let selectedNode = null;

canvas.addEventListener("click", e => {

    const rect = canvas.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const clickedNode = findNode(x, y);

    if (e.shiftKey) {

        if (clickedNode) {

            if (!selectedNode) {
                selectedNode = clickedNode;
            }
            else {

                if (selectedNode.id !== clickedNode.id) {

                    if (!GraphUtils.hasDuplicateSegment(selectedNode, clickedNode)) {

                        engine.structure.segments.push(
                            new RoadSegment(selectedNode, clickedNode)
                        );
                    }
                }

                selectedNode = null;

                PipelineRunner.rebuild();
                Renderer.draw(ctx);
            }
        }

        return;
    }

    const node = new Node(x, y);

    engine.structure.nodes.push(node);

    PipelineRunner.rebuild();
    Renderer.draw(ctx);
});

function findNode(x, y) {

    return engine.structure.nodes.find(node => {
        return Math.hypot(node.x - x, node.y - y) < 10;
    });
}

// =====================================================
// INITIAL DRAW
// =====================================================

Renderer.draw(ctx);

</script>
</body>
</html>
